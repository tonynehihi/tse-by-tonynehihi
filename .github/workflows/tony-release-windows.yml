# Tony release helper: build the Windows portable zip for a published release
# and attach it to that release. This replaces hand cross-building the zip on
# the maintainer's VM (those builds kept dying to OOM / VM restarts); a real
# Windows runner builds the native .exe instead.
#
# Triggers:
#   - automatically when a release is published;
#   - manually (Actions -> "Release Windows portable" -> Run workflow) with a
#     tag, to backfill the zip for an older release.
#
# The zip keeps the established portable layout: one top folder "TS Excel"
# holding gridcraft.exe + HUONG-DAN.txt. HUONG-DAN.txt is generated below
# (there is no canonical Windows copy in the tree — packaging/macos/
# HUONG-DAN.md is the macOS text); it is the stable how-to-run text without
# the per-release "what's new" notes, which live in the release notes.
# The binary is unsigned, as with the hand-built zips (SmartScreen note is
# in HUONG-DAN.txt).

name: Release Windows portable

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build the Windows zip for (e.g. v1.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          "tag=${{ github.event.release.tag_name || inputs.tag }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Build the app (release)
        run: cargo build --release --locked -p gridcraft

      - name: Assemble the portable folder and zip it
        id: pkg
        shell: pwsh
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $version = $env:TAG -replace '^v', ''
          $folder = "TS Excel"
          $stage = Join-Path $env:GITHUB_WORKSPACE "dist/windows/$folder"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/release/gridcraft.exe" $stage
          $guide = @'
          TS Excel __VERSION__ — bản Windows portable (không cần cài đặt)
          ==========================================================

          Bản build cá nhân của Tony, dựa trên GridCraft của storytold (MIT/Apache-2.0).

          CÁCH CHẠY
          ---------
          1. Giải nén cả thư mục "TS Excel" ra chỗ nào cũng được (Desktop, Documents...).
          2. Mở thư mục, chạy file gridcraft.exe.
          3. Không cần cài đặt gì thêm. Xóa thư mục là gỡ xong.

          WINDOWS CHẶN LẦN ĐẦU (SmartScreen)
          -----------------------------------
          Vì bản này không có chữ ký số của Microsoft, Windows có thể hiện màn hình
          xanh "Windows protected your PC" khi chạy lần đầu:
          - Bấm "More info" → bấm "Run anyway".
          Chỉ cần làm 1 lần.

          LƯU TRỮ DỮ LIỆU
          ----------------
          Settings và dữ liệu của app nằm ở %APPDATA%\GridCraft (giữ nguyên tên như
          bản gốc), không nằm trong thư mục này — di chuyển thư mục app thoải mái.

          CẬP NHẬT BẢN MỚI
          ----------------
          Trên Windows, app báo có bản mới trong mục About (Help → About TS Excel,
          phần Updates) nhưng chưa tự cài được như bản macOS. Khi có bản mới:
          tải file tse-by-tonynehihi-__VERSION__-windows.zip mới nhất ở trang Releases
          của repo tonynehihi/tse-by-tonynehihi, giải nén đè thư mục cũ là xong
          (settings không bị ảnh hưởng).
          '@
          $guide = $guide -replace '__VERSION__', $version
          Set-Content -Path (Join-Path $stage "HUONG-DAN.txt") -Value $guide -Encoding utf8BOM
          $asset = "tse-by-tonynehihi-$version-windows.zip"
          Compress-Archive -Path "dist/windows/$folder" -DestinationPath "dist/windows/$asset"
          "asset=dist/windows/$asset" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Attach the Windows zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.tag.outputs.tag }}" "${{ steps.pkg.outputs.asset }}" --clobber
